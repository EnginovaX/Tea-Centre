<script>
        // Simple entrance animation for the floating card
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.getElementById('status-card');
            setTimeout(() => {
                card.classList.remove('slide-up-enter');
                card.classList.add('slide-up-active');
            }, 100);
        });
