<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md">
<!-- Top App Bar (Simplified for transactional flow, keeping back button) -->
<header class="flex justify-between items-center px-container-margin-mobile md:px-container-margin-desktop h-16 w-full fixed top-0 z-50 bg-surface">
<button class="p-2 text-primary hover:bg-surface-container-low transition-colors rounded-full active:scale-95 duration-150 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<!-- No global nav elements as this is a transactional screen -->
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin-mobile pt-16 pb-safe w-full max-w-md mx-auto">
<div class="text-center w-full mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-2">Verify Phone</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Enter the 6-digit code sent to <br/>
<span class="font-label-md text-label-md text-on-surface">+91 98765 43210</span>
</p>
</div>
<div class="w-full mb-8">
<div class="flex justify-between gap-2 md:gap-4 mb-6">
<!-- OTP Inputs -->
<input aria-label="Digit 1" class="w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md bg-surface-container-low border border-outline/30 rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" maxlength="1" type="number"/>
<input aria-label="Digit 2" class="w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md bg-surface-container-low border border-outline/30 rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" maxlength="1" type="number"/>
<input aria-label="Digit 3" class="w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md bg-surface-container-low border border-outline/30 rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" maxlength="1" type="number"/>
<input aria-label="Digit 4" class="w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md bg-surface-container-low border border-outline/30 rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" maxlength="1" type="number"/>
<input aria-label="Digit 5" class="w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md bg-surface-container-low border border-outline/30 rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" maxlength="1" type="number"/>
<input aria-label="Digit 6" class="w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md bg-surface-container-low border border-outline/30 rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" maxlength="1" type="number"/>
</div>
<button class="w-full bg-primary-container text-on-primary py-4 rounded-full font-label-md text-label-md shadow-lg hover:opacity-90 active:scale-95 transition-all">
                Verify &amp; Proceed
            </button>
</div>
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant mb-1">Didn't receive the code?</p>
<button class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled="" id="resend-btn">
                Resend in <span id="timer">0:30</span>
</button>
</div>
</main>
<script>
        // Simple auto-advance for OTP inputs
        const inputs = document.querySelectorAll('input[type="number"]');
        inputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                if (input.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Simple timer logic
        let timeLeft = 30;
        const timerSpan = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');

        const countdown = setInterval(() => {
            timeLeft--;
            timerSpan.textContent = `0:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                resendBtn.innerHTML = 'Resend Code';
                resendBtn.removeAttribute('disabled');
            }
        }, 1000);
    </script>
</body></html>
