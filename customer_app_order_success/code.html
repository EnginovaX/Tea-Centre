<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tea Centre - Order Success</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;family=Be+Vietnam+Pro:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#ffb77a",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#464626",
                        "surface-container-highest": "#e9e1dc",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#783603",
                        "tertiary": "#60603e",
                        "surface-dim": "#e1d8d4",
                        "tertiary-container": "#b5b48b",
                        "surface": "#fff8f5",
                        "surface-bright": "#fff8f5",
                        "on-primary-fixed-variant": "#6d3a00",
                        "surface-variant": "#e9e1dc",
                        "primary-fixed": "#ffdcc2",
                        "on-primary-fixed": "#2e1500",
                        "surface-tint": "#8f4e00",
                        "on-background": "#1e1b18",
                        "secondary-fixed": "#ffdbc9",
                        "inverse-primary": "#ffb77a",
                        "primary-container": "#ff9933",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#f8efea",
                        "background": "#fff8f5",
                        "surface-container-low": "#fbf2ed",
                        "tertiary-fixed": "#e6e5b9",
                        "secondary-fixed-dim": "#ffb68c",
                        "on-secondary-fixed-variant": "#753401",
                        "tertiary-fixed-dim": "#cac99f",
                        "outline": "#887364",
                        "on-tertiary-fixed-variant": "#484828",
                        "on-primary-container": "#693800",
                        "on-tertiary-fixed": "#1d1d03",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#34302c",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#efe6e2",
                        "on-surface-variant": "#554336",
                        "surface-container": "#f5ece7",
                        "on-tertiary": "#ffffff",
                        "primary": "#8f4e00",
                        "secondary": "#934b19",
                        "outline-variant": "#dbc2b0",
                        "on-surface": "#1e1b18",
                        "on-primary": "#ffffff",
                        "secondary-container": "#ffa26a",
                        "on-secondary-fixed": "#321200"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "lg": "24px",
                        "container-margin-mobile": "16px",
                        "md": "16px",
                        "unit": "4px",
                        "sm": "8px",
                        "xs": "4px",
                        "container-margin-desktop": "64px",
                        "xl": "40px"
                    },
                    "fontFamily": {
                        "label-md": ["Be Vietnam Pro"],
                        "headline-lg-mobile": ["Montserrat"],
                        "headline-md": ["Montserrat"],
                        "body-md": ["Be Vietnam Pro"],
                        "price-display": ["Montserrat"],
                        "headline-lg": ["Montserrat"],
                        "headline-xl": ["Montserrat"],
                        "body-lg": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "30px", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "price-display": ["22px", { "lineHeight": "22px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .success-animation {
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col pt-16 pb-20">
<!-- TopAppBar (Suppressed navigation logic applied due to transactional end-state, but keeping the shell as requested by user, though technically a contradiction to the rule. Assuming user intent overrides strict nav suppression for this specific output structure.) -->
<header class="bg-surface dark:bg-surface-dim font-headline-md text-headline-md docked full-width top-0 bg-surface dark:bg-surface-dim flat no shadows transition-opacity duration-200 fixed top-0 w-full z-50 flex items-center justify-between px-md h-16">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:opacity-80 p-2 -ml-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim absolute left-1/2 -translate-x-1/2">Tea Centre</span>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin-mobile md:px-container-margin-desktop py-lg max-w-lg mx-auto w-full space-y-xl">
<!-- Hero Graphic -->
<div class="flex flex-col items-center text-center space-y-md">
<div class="w-32 h-32 bg-primary-container rounded-full flex items-center justify-center success-animation shadow-[0px_4px_20px_rgba(143,78,0,0.15)] mb-4">
<span class="material-symbols-outlined text-white text-7xl" style="font-variation-settings: 'FILL' 1; font-size: 80px;">check_circle</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary">Order Placed Successfully!</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mx-auto">Your snacks are being prepared with love.</p>
</div>
<!-- Order Summary Card -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(143,78,0,0.05)] p-lg border border-outline/10">
<div class="flex justify-between items-center mb-md border-b border-outline/10 pb-md">
<span class="font-label-md text-label-md text-on-surface-variant">Order ID: #TC-9821</span>
<span class="font-label-md text-label-md text-primary font-bold">25-30 mins</span>
</div>
<div class="space-y-sm mb-md">
<div class="flex justify-between items-center font-body-md text-body-md">
<span>1x Masala Chai</span>
<span class="font-price-display text-sm">₹40</span>
</div>
<div class="flex justify-between items-center font-body-md text-body-md">
<span>2x Punjabi Samosa</span>
<span class="font-price-display text-sm">₹60</span>
</div>
</div>
<div class="pt-sm border-t border-outline/10 flex justify-between items-center mt-sm">
<span class="font-label-md text-label-md font-bold">Total</span>
<span class="font-price-display text-price-display text-primary">₹100</span>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col space-y-md w-full max-w-xs mx-auto">
<button class="w-full bg-primary-container hover:bg-primary-container/90 text-on-primary-container font-label-md text-label-md py-4 rounded-full shadow-lg shadow-primary-container/30 transition-transform active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">map</span>
                Track Your Order
            </button>
<button class="w-full bg-transparent hover:bg-surface-variant/50 text-primary font-label-md text-label-md py-4 rounded-full border border-outline/20 transition-colors">
                Back to Menu
            </button>
</div>
</main>
<!-- BottomNavBar (Transaction end-state usually suppresses nav, but executing user request for 'Orders' tab active) -->
<nav class="bg-surface-container-lowest dark:bg-surface-container-low font-label-md text-label-md docked full-width bottom-0 rounded-t-xl shadow-[0px_-4px_20px_rgba(143,78,0,0.05)] shadow-lg fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter py-sm md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-variant dark:hover:bg-surface-container-highest rounded-lg transition-colors" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">restaurant_menu</span>
<span class="text-xs">Menu</span>
</a>
<!-- Active Tab: Orders -->
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-full px-4 py-1 Active: scale-95 transition-transform duration-150" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
<span class="text-xs font-bold">Orders</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-variant dark:hover:bg-surface-container-highest rounded-lg transition-colors" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">local_offer</span>
<span class="text-xs">Offers</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-variant dark:hover:bg-surface-container-highest rounded-lg transition-colors" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="text-xs">Account</span>
</a>
</nav>
</body></html>
